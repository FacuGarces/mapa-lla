<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" href="img/favicon.png">
<title>Mapa LLA y aliados</title>
<meta name="description" content="Relevamiento territorial de representantes de La Libertad Avanza y posibles aliados: Congreso, legislaturas, concejos deliberantes y consejos escolares.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&family=Fira+Code:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="styles.css?v=55">
</head>
<body>
<div id="map" aria-label="Mapa de Argentina"></div>

<aside id="panel" class="panel" aria-label="Panel de navegación">
  <div id="grip" class="grip" role="button" tabindex="0" aria-label="Arrastrá o tocá para agrandar o achicar el panel"><span></span></div>
  <header class="ph">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"><img src="img/aguila.png" alt=""></div>
      <div class="brand-t"><h1>Mapa LLA y aliados</h1><p id="cutoff">Relevamiento territorial</p></div>
      <button id="collapse" class="icon-btn" aria-label="Ocultar panel" title="Ocultar panel"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16M15.5 10l-2 2 2 2"/></svg></button>
    </div>
    <div class="search" role="combobox" aria-expanded="false" aria-haspopup="listbox" aria-owns="searchList">
      <svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Buscar persona, municipio o provincia" autocomplete="off" aria-label="Buscar" aria-controls="searchList">
      <ul id="searchList" class="search-list" role="listbox" hidden></ul>
    </div>
    <nav id="nav" class="nav" aria-label="Navegación"></nav>
  </header>
  <div id="body" class="pb" tabindex="-1"></div>
  <footer class="pf">
    <div class="filters" role="group" aria-label="Mostrar">
      <span class="fl">Mostrar</span>
      <button class="chip on" data-k="LLA" aria-pressed="true"><i class="dot lla"></i>LLA</button>
      <button class="chip on" data-k="posible_aliado" aria-pressed="true"><i class="dot ali"></i>Aliados</button>
      <button class="chip on" data-k="disidente" aria-pressed="true"><i class="dot dis"></i>Disidentes</button>
      <button class="chip q" data-k="q" aria-pressed="false"><svg class="ic s" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7M12 17h.01"/></svg>Solo a confirmar</button>
    </div>
    <p class="src">Fuentes oficiales y prensa local. Solo contacto institucional.</p>
  </footer>
</aside>
<button id="reopen" class="reopen" hidden><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16M13.5 10l2 2-2 2"/></svg>Mostrar panel</button>

<div id="legend" class="legend" aria-live="polite"></div>
<div id="tip" class="tip" role="tooltip" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="app.js?v=55"></script>
</body>
</html>
